colors: true

pre-commit:
    parallel: true

    # ---- Spotless ----
    commands:
        spotless:
            run: ./scripts/spotless-pre-commit.sh
            glob: "*.{kt,kts}"

        # ---- Ktlint ----

        ktlintFormat:
            glob: "*.kt"
            run: echo "\033[0;34m🔍 Running Ktlint Format...\033[0m" && ./gradlew ktlintFormat -x spotlessKotlin -x spotlessKotlinGradle || { echo "\033[0;31m❌ Ktlint Format FAILED!\033[0m" >&2; exit 1; }

        ktlint:
            glob: "*.kt"
            run: echo "\033[0;34m🔍 Running Ktlint checks...\033[0m" && ./gradlew ktlintCheck -x spotlessKotlin -x spotlessKotlinGradle || { echo "\033[0;31m❌ Ktlint checks FAILED!\033[0m" >&2; exit 1; }


        # ---- Prettier (TypeScript/JavaScript formatting) ----
        prettier:
            run: ./scripts/prettier-pre-commit.sh
            glob: "*.{ts,tsx,js,jsx}"

        # ---- React Native (lint type checking) ----
        eslint:
            root: "react-native"
            glob: "*.{ts,tsx,js,jsx}"
            run: echo "\033[0;34m🔍 Running ESLint checks...\033[0m" && npm run lint --if-present || { echo "\033[0;31m❌ ESLint checks FAILED!\033[0m" >&2; exit 1; }


pre-push:
    parallel: false

    commands:
        # ---- Android Lint ----
        android_lint:
            run: echo "\033[0;34m🔍 Running Android Lint...\033[0m" && ./gradlew lint || { echo "\033[0;31m❌ Android Lint FAILED!\033[0m" >&2; exit 1; }

        # ---- Android Unit Tests ----
        android_tests:
            run: echo "\033[0;35m🧪 Running Android tests...\033[0m" && ./gradlew test || { echo "\033[0;31m❌ Android tests FAILED!\033[0m" >&2; exit 1; }

        # ---- React Native Tests (Jest) ----
        rn_tests:
            root: "react-native"
            run: echo "\033[0;35m🧪 Running React Native tests...\033[0m" && npm test --if-present || { echo "\033[0;31m❌ React Native tests FAILED!\033[0m" >&2; exit 1; }

        # ---- Build Verification ----
        android_build:
            run: echo "\033[0;33m🔨 Building Android app...\033[0m" && ./gradlew assembleDebug || { echo "\033[0;31m❌ Android build FAILED!\033[0m" >&2; exit 1; }


