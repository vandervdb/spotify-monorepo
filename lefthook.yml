colors: true

pre-commit:
    parallel: true

    # ---- Spotless ----
    commands:
        spotless:
            run: ./scripts/spotless-pre-commit.sh
            glob: "*.{kt,kts}"

        # ---- Ktlint ----
        ktlint:
            glob: "*.kt"
            run: echo "🔍 RUNNING Ktlint checks..." && ./gradlew ktlintCheck -x spotlessKotlin -x spotlessKotlinGradle

        # ---- Prettier (TypeScript/JavaScript formatting) ----
        prettier:
            run: ./scripts/prettier-pre-commit.sh
            glob: "*.{ts,tsx,js,jsx}"

        # ---- React Native (lint type checking) ----
        eslint:
            root: "react-native"
            glob: "*.{ts,tsx,js,jsx}"
            run: echo " ✅ RUNNING TS lint checks... " && npm run lint --if-present


pre-push:
    parallel: false

    commands:
        # ---- Android Lint ----
        android_lint:
            run: echo " ✅ RUNNING Android lint checks... " && ./gradlew lint

        # ---- Android Unit Tests ----
        android_tests:
            run: echo " ✅ RUNNING Android tests checks... " &&  ./gradlew test

        # ---- React Native Tests (Jest) ----
        rn_tests:
            root: "react-native"
            run: echo " ✅ RUNNING React native test checks... " && npm test --if-present

        # ---- Build Verification ----
        android_build:
            run: echo " ✅ RUNNING Android builds... " && ./gradlew assembleDebug


